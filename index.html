<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>500m 공중화장실 찾기</title>
<style>
  :root{
    --black:#05060b;--navy:#0b1533;--navy2:#13224d;--line:#25396e;
    --ink:#f2f6ff;--sub:#9db0dd;--pink:#ff2bd6;--cyan:#3be8ff;--lime:#b6ff3b;--red:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);
    background:linear-gradient(180deg,var(--black) 0%,var(--black) 18%,var(--navy) 100%) fixed;
    font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.45}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 44px}
  h1{display:flex;align-items:center;gap:10px;font-size:26px;margin:4px 0 6px;letter-spacing:-.02em}
  h1 .badge{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--navy2);border:1px solid var(--line);font-size:24px}
  h1 em{font-style:normal;color:var(--pink);text-shadow:0 0 12px rgba(255,43,214,.7)}
  .lead{color:var(--sub);margin:0 0 14px;font-size:15px}
  .notice{display:flex;gap:8px;background:rgba(19,34,77,.7);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--sub);margin-bottom:14px}
  .notice b{color:var(--ink)}
  .mapbox{background:linear-gradient(160deg,var(--navy2),var(--navy));border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  svg{display:block;width:100%;height:auto;touch-action:manipulation;cursor:crosshair;border-radius:12px;background:#070d22}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin:9px 3px 2px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
  .dot.me{background:#b6ff3b;box-shadow:0 0 8px #b6ff3b}
  .dot.t{background:var(--pink)}
  .dot.r{border:1.5px dashed var(--cyan);background:transparent}
  .summary{margin:18px 2px 10px;font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
  .summary b{color:var(--pink);text-shadow:0 0 10px rgba(255,43,214,.6)}
  .item{display:flex;gap:12px;align-items:center;background:var(--navy2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:9px;cursor:pointer;transition:transform .08s}
  .item:active{transform:scale(.985)}
  .item.first{border:2px solid var(--cyan);box-shadow:0 0 18px rgba(59,232,255,.25)}
  .item.sel{border:2px solid var(--lime);box-shadow:0 0 16px rgba(182,255,59,.3)}
  .item.closed{opacity:.6}
  .num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 0 12px rgba(255,43,214,.6)}
  .info{flex:1;min-width:0}
  .name{font-weight:700;font-size:16px}
  .meta{font-size:13px;color:var(--sub);margin-top:2px}
  .tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:rgba(59,232,255,.15);color:var(--cyan);font-size:12px;font-weight:700}
  .tag.open{background:rgba(182,255,59,.16);color:var(--lime)}
  .tag.shut{background:rgba(255,107,107,.18);color:var(--red)}
  .dist{flex:none;text-align:right}
  .dist .m{font-size:21px;font-weight:800;color:var(--ink)}
  .dist .t{font-size:12px;color:var(--sub)}
  .empty{background:var(--navy2);border:1px dashed var(--line);border-radius:14px;padding:14px;font-size:14px;color:var(--sub);margin-bottom:9px}
  @keyframes pulse{0%{r:9;opacity:.9}100%{r:26;opacity:0}}
  .pulse{animation:pulse 1.6s ease-out infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.1}}
  .blink,.siren{animation:blink .8s steps(1) infinite}
  .siren{flex:none;font-size:22px;margin-left:-4px}
  .route{margin-top:12px;background:linear-gradient(160deg,var(--navy2),var(--navy));border:1.5px solid var(--lime);border-radius:16px;padding:12px 14px;box-shadow:0 0 18px rgba(182,255,59,.18)}
  .rtop{display:flex;gap:14px;align-items:center}
  .arrow{flex:none;width:52px;height:52px;border-radius:50%;background:rgba(182,255,59,.12);border:1.5px solid var(--lime);display:grid;place-items:center;overflow:hidden}
  .arrow i{font-style:normal;font-size:26px;line-height:1;color:var(--lime);text-shadow:0 0 10px var(--lime);display:block;transition:transform .25s}
  .rt{font-size:18px;font-weight:800}
  .rt b{color:var(--lime);text-shadow:0 0 8px rgba(182,255,59,.6)}
  .rs{font-size:13px;color:var(--sub);margin-top:2px}
  .addr{font-size:13px;color:var(--ink);margin-top:10px}
  .go{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .go a{flex:1 1 30%;text-align:center;text-decoration:none;font-size:14px;font-weight:800;padding:11px 8px;border-radius:12px;border:1.5px solid var(--lime);color:var(--lime);background:rgba(182,255,59,.08)}
  .go a.main{background:var(--lime);color:#071300}
  .rn{font-size:11.5px;color:var(--sub);opacity:.85;margin-top:9px}
  @keyframes flow{to{stroke-dashoffset:-26}}
  .flow{animation:flow .9s linear infinite}
  .reset{margin-top:12px;width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--pink);background:transparent;color:var(--pink);font-size:15px;font-weight:700;cursor:pointer;text-shadow:0 0 8px rgba(255,43,214,.5)}
  .reset:active{background:rgba(255,43,214,.12)}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="badge">💩</span><span>500m <em>화장실</em> 찾기</span></h1>
  <p class="lead">🧍 지도를 눌러 내 위치를 정하면, 반경 500m 안 화장실이 가까운 순서로 나와요. 시작 위치는 <b>연산역</b>입니다.</p>
  <div class="notice"><span>⚠️</span><span><b>시작 위치(연산역)는 가상</b>이고, 지도 위 화장실은 <b>실제 좌표</b>로 찍혀요. 화장실 위치·이름·개방시간은 <b>OpenStreetMap(Overpass) 실시간 데이터</b>라 비어 있거나 실제와 다를 수 있으니 방문 전에 확인하세요.</span></div>

  <div class="mapbox">
    <svg id="map" viewBox="0 0 360 360" role="img" aria-label="내 위치와 주변 화장실 지도">
      <defs>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="layer"></g>
    </svg>
    <div class="legend">
      <span><i class="dot me"></i>내 위치</span>
      <span><i class="dot t"></i>화장실</span>
      <span><i class="dot r"></i>반경 500m</span>
    </div>
  </div>

  <div class="route" id="route"></div>
  <div class="summary" id="summary"></div>
  <div id="list"></div>
  <button class="reset" id="reset">🧍 연산역으로 되돌리기</button>
  <p class="rn" id="credit">데이터 © OpenStreetMap contributors · Overpass API</p>
</div>

<script>
(function(){
  var SIZE=360, MPP=1400/SIZE, R=500, WALK=70;
  var PINK='#ff2bd6', LIME='#b6ff3b', CYAN='#3be8ff', GRID='#18275a', DIM='#5b6fa8';
  var ICON={"지하철역":"🚇","공원":"🌳","마트":"🛒","시장":"🛍️","공중화장실":"💩"};
  var DIRS=['북','북동','동','남동','남','남서','서','북서'];
  // 가상 시작점: 연산역(부산 연제구) 근처. 이 좌표를 (0,0)으로 삼고 m 단위로 계산해요.
  var LAT0=35.1860, LON0=129.0813, FETCH_R=1500;
  var ENDPOINTS=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter'];
  var TOILETS=[], status='loading';
  var me={x:0,y:0}, sel=null;
  var svg=document.getElementById('map'), layer=document.getElementById('layer');
  var list=document.getElementById('list'), sum=document.getElementById('summary'), routeEl=document.getElementById('route');
  var NS='http://www.w3.org/2000/svg';

  function el(n,a,t){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e;}
  function px(m){return SIZE/2+m/MPP;}
  function py(m){return SIZE/2-m/MPP;}
  function dist(t){var a=t.dx-me.x,b=t.dy-me.y;return Math.sqrt(a*a+b*b);}
  // <parse>
  function pad(n){return (n<10?'0':'')+n;}
  function parseHours(oh){
    if(!oh)return null;
    var t=String(oh).trim();
    if(/^24\/7$/i.test(t))return {all:true,text:'24시간'};
    var m=t.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
    if(!m)return null;
    var s0=(+m[1])*60+(+m[2]), e0=(+m[3])*60+(+m[4]);
    if(e0<=s0)e0+=1440;
    return {s:s0,e:e0,text:pad(+m[1])+':'+m[2]+'~'+pad(+m[3])+':'+m[4]};
  }
  function openAt(hp,nowMin){
    if(!hp)return null;
    if(hp.all)return true;
    return (nowMin>=hp.s&&nowMin<hp.e)||(nowMin+1440>=hp.s&&nowMin+1440<hp.e);
  }
  function guessType(tags){
    var n=(tags['name']||'')+' '+(tags['name:ko']||'');
    if(/역|지하철/.test(n)||tags['railway']==='station'||tags['subway']==='yes')return '지하철역';
    if(/공원/.test(n))return '공원';
    if(/시장/.test(n))return '시장';
    if(/마트|백화점|쇼핑/.test(n))return '마트';
    return '공중화장실';
  }
  function amenText(tags){
    var a=[];
    if(tags['wheelchair']==='yes')a.push('장애인 이용 가능');
    if(tags['changing_table']==='yes')a.push('기저귀 교환대');
    if(tags['unisex']==='yes')a.push('남녀공용');
    if(tags['fee']==='yes')a.push('유료');else if(tags['fee']==='no')a.push('무료');
    if(tags['access']==='customers')a.push('고객 전용');
    return a.length?a.join(' · '):'편의시설 정보 없음';
  }
  function addrText(tags){
    if(tags['addr:full'])return tags['addr:full'];
    var p=[tags['addr:city'],tags['addr:street'],tags['addr:housenumber']].filter(Boolean).join(' ');
    return p||'';
  }
  function toToilet(el){
    var tags=el.tags||{};
    if(tags['access']==='private'||tags['access']==='no')return null;
    var lat=el.lat!=null?el.lat:(el.center&&el.center.lat), lon=el.lon!=null?el.lon:(el.center&&el.center.lon);
    if(lat==null||lon==null)return null;
    var dx=(lon-LON0)*111320*Math.cos(LAT0*Math.PI/180), dy=(lat-LAT0)*110574;
    var nm=tags['name:ko']||tags['name']||'공중화장실';
    return {name:nm,named:!!(tags['name:ko']||tags['name']),type:guessType(tags),dx:dx,dy:dy,lat:lat,lon:lon,
      addr:addrText(tags),hp:parseHours(tags['opening_hours']),amen:amenText(tags)};
  }
  // </parse>
  function isOpen(t){var d=new Date();return openAt(t.hp,d.getHours()*60+d.getMinutes());}
  function hoursText(t){return t.hp?t.hp.text:'개방시간 미확인';}
  function esc(s){return encodeURIComponent(s);}

  function render(){
    if(status!=='ok'){
      layer.innerHTML='';routeEl.innerHTML='';list.innerHTML='';
      sum.innerHTML=status==='loading'?'⏳ 화장실 목록 불러오는 중…':'😥 목록을 불러오지 못했어요';
      if(status==='error'){var e=document.createElement('div');e.className='empty';e.textContent='무료 지도 서버(Overpass)가 바쁠 수 있어요. 위의 "목록을 불러오지 못했어요" 글자를 누르면 다시 불러와요. (연결이 안 되면 목록을 보여 줄 수 없어요)';list.appendChild(e);}
      return;
    }
    var rows=TOILETS.map(function(t){return {t:t,d:dist(t),o:isOpen(t)};})
      .sort(function(a,b){return ((a.o===false?1:0)-(b.o===false?1:0))||a.d-b.d;});
    var inside=rows.filter(function(r){return r.d<=R;});
    var shown=inside.length?inside:rows.slice(0,1);
    if(sel&&!shown.some(function(r){return r.t===sel;}))sel=null;
    var target=sel||shown[0].t;

    // 가는 길 카드
    var ddx=target.dx-me.x, ddy=target.dy-me.y, td=Math.sqrt(ddx*ddx+ddy*ddy);
    var brg=(Math.atan2(ddx,ddy)*180/Math.PI+360)%360;
    var dname=DIRS[Math.round(brg/45)%8];
    var gq=target.lat+','+target.lon, nq=esc(target.named?target.name:'공중화장실 '+target.lat.toFixed(5)+','+target.lon.toFixed(5));
    routeEl.innerHTML='<div class="rtop"><div class="arrow"><i style="transform:rotate('+(brg-90)+'deg)">➤</i></div><div><div class="rt"><b></b>쪽으로 약 <b></b></div><div class="rs"></div></div></div>'
      +'<div class="addr"></div>'
      +'<div class="go"><a class="main" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+gq+'&travelmode=walking">🚶 길찾기 (구글)</a>'
      +'<a target="_blank" rel="noopener" href="https://map.kakao.com/link/to/'+esc(target.name)+','+gq+'">카카오맵</a>'
      +'<a target="_blank" rel="noopener" href="https://map.naver.com/p/search/'+nq+'">네이버지도</a></div>'
      +'<div class="rn">※ 길찾기 버튼을 누르면 지도 앱이 열리고, 출발지는 폰의 현재 위치로 잡혀요. 위 방향·거리는 화면의 내 위치(가상) 기준입니다.</div>';
    var bs=routeEl.querySelectorAll('.rt b');
    bs[0].textContent=dname; bs[1].textContent=(Math.round(td/10)*10)+'m';
    routeEl.querySelector('.rs').textContent='🚶 걸어서 약 '+Math.max(1,Math.round(td/WALK))+'분 · '+target.name;
    routeEl.querySelector('.addr').textContent='📍 '+(target.addr||'주소 정보 없음')+' · '+hoursText(target)+' · '+target.amen;

    // 지도
    while(layer.firstChild)layer.removeChild(layer.firstChild);
    for(var g=1;g<6;g++){
      layer.appendChild(el('line',{x1:g*60,y1:0,x2:g*60,y2:SIZE,stroke:GRID,'stroke-width':.8}));
      layer.appendChild(el('line',{x1:0,y1:g*60,x2:SIZE,y2:g*60,stroke:GRID,'stroke-width':.8}));
    }
    var cx=px(me.x), cy=py(me.y);
    layer.appendChild(el('circle',{cx:cx,cy:cy,r:R/MPP,fill:CYAN,'fill-opacity':.06,stroke:CYAN,'stroke-width':1.6,'stroke-dasharray':'6 5','stroke-opacity':.8}));
    layer.appendChild(el('line',{x1:cx,y1:cy,x2:px(target.dx),y2:py(target.dy),stroke:LIME,'stroke-width':2.5,'stroke-dasharray':'7 6','stroke-linecap':'round','class':'flow'}));
    layer.appendChild(el('text',{x:px(0),y:py(0)+30,'text-anchor':'middle','font-size':11,fill:DIM},'연산역'));

    rows.forEach(function(r){
      var idx=shown.indexOf(r), on=idx>=0, x=px(r.t.dx), y=py(r.t.dy);
      if(on){
        if(r.t===target)layer.appendChild(el('circle',{cx:x,cy:y,r:18,fill:'none',stroke:LIME,'stroke-width':2.5}));
        layer.appendChild(el('circle',{cx:x,cy:y,r:12,fill:r.o===false?'#6b4a78':PINK,filter:'url(#glow)'}));
        layer.appendChild(el('text',{x:x,y:y+4.5,'text-anchor':'middle','font-size':13,'font-weight':800,fill:'#fff'},String(idx+1)));
        if(idx===0){layer.appendChild(el('text',{x:x+16,y:y+5,'font-size':16,'class':'blink'},'🚨'));}
      }else{
        layer.appendChild(el('circle',{cx:x,cy:y,r:5,fill:DIM}));
      }
    });

    layer.appendChild(el('circle',{cx:cx,cy:cy,r:9,fill:'none',stroke:LIME,'stroke-width':2.5,'class':'pulse'}));
    var person=el('g',{filter:'url(#glow)',fill:LIME,stroke:'#fff','stroke-width':1.8,'stroke-linejoin':'round'});
    person.appendChild(el('circle',{cx:cx,cy:cy-9,r:5.5}));
    person.appendChild(el('path',{d:'M'+(cx-8.5)+','+(cy+12)+' Q'+(cx-8.5)+','+(cy-1)+' '+cx+','+(cy-1)+' Q'+(cx+8.5)+','+(cy-1)+' '+(cx+8.5)+','+(cy+12)+' Z'}));
    layer.appendChild(person);
    layer.appendChild(el('text',{x:cx,y:cy-24,'text-anchor':'middle','font-size':13,'font-weight':800,fill:LIME,stroke:'#05060b','stroke-width':3,'paint-order':'stroke'},'나'));

    // 목록
    list.innerHTML='';
    if(inside.length){
      sum.innerHTML='💩 500m 안에 <b>'+inside.length+'곳</b>';
    }else{
      sum.innerHTML='😥 500m 안엔 없어요';
      var e=document.createElement('div');e.className='empty';
      e.textContent='반경 500m 안에 등록된 화장실이 없습니다. 가장 가까운 한 곳을 보여드려요.';
      list.appendChild(e);
    }
    shown.forEach(function(r,i){
      var d=Math.round(r.d/10)*10, min=Math.max(1,Math.round(r.d/WALK));
      var it=document.createElement('div');
      it.className='item'+(i===0?' first':'')+(r.t===target?' sel':'')+(r.o===false?' closed':'');
      it.addEventListener('click',function(){sel=r.t;render();window.scrollTo({top:0,behavior:'smooth'});});
      it.innerHTML='<div class="num">'+(i+1)+'</div>'+(i===0?'<span class="siren">🚨</span>':'')+'<div class="info"><div class="name"></div><div class="meta"></div></div><div class="dist"><div class="m">'+d+'m</div><div class="t">🚶 약 '+min+'분</div></div>';
      it.querySelector('.name').textContent=r.t.name;
      var meta=it.querySelector('.meta');
      meta.textContent=(ICON[r.t.type]||'💩')+' '+r.t.type+' · '+hoursText(r.t)+' ';
      var st=document.createElement('span');st.className='tag '+(r.o===true?'open':(r.o===false?'shut':''));st.textContent=r.o===true?'지금 열림':(r.o===false?'지금 닫힘':'시간 미확인');meta.appendChild(st);
      if(i===0){var tg=document.createElement('span');tg.className='tag';tg.textContent='⭐ 가장 가까워요';meta.appendChild(tg);}
      var am=document.createElement('div');am.className='meta';am.textContent='🧰 '+r.t.amen;
      it.querySelector('.info').appendChild(am);
      list.appendChild(it);
    });
  }

  function pick(ev){
    if(status!=='ok')return;
    var b=svg.getBoundingClientRect();
    var x=(ev.clientX-b.left)/b.width*SIZE, y=(ev.clientY-b.top)/b.height*SIZE;
    var hit=null, best=20;
    TOILETS.forEach(function(t){
      if(dist(t)>R)return;
      var d=Math.hypot(px(t.dx)-x,py(t.dy)-y);
      if(d<best){best=d;hit=t;}
    });
    if(hit){sel=hit;render();return;}
    sel=null;
    me={x:(x-SIZE/2)*MPP,y:-(y-SIZE/2)*MPP};
    render();
  }
  svg.addEventListener('click',pick);
  document.getElementById('reset').addEventListener('click',function(){me={x:0,y:0};sel=null;render();});
  function overpass(i,query){
    var url=ENDPOINTS[i];
    if(!url)return Promise.reject(new Error('no endpoint'));
    var ctl=('AbortController' in window)?new AbortController():null;
    var timer=setTimeout(function(){if(ctl)ctl.abort();},20000);
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(query),signal:ctl?ctl.signal:undefined})
      .then(function(r){clearTimeout(timer);if(!r.ok)throw new Error(r.status);return r.json();})
      .catch(function(){clearTimeout(timer);return overpass(i+1,query);});
  }
