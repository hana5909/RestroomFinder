<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>500m 공중화장실 찾기</title>
<style>
  :root{
    --black:#05060b;--navy:#0b1533;--navy2:#13224d;--line:#25396e;
    --ink:#f2f6ff;--sub:#9db0dd;--pink:#ff2bd6;--cyan:#3be8ff;--lime:#b6ff3b;--red:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);
    background:linear-gradient(180deg,var(--black) 0%,var(--black) 18%,var(--navy) 100%) fixed;
    font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.45}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 44px}
  h1{display:flex;align-items:center;gap:10px;font-size:26px;margin:4px 0 6px;letter-spacing:-.02em}
  h1 .badge{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--navy2);border:1px solid var(--line);font-size:24px}
  h1 em{font-style:normal;color:var(--pink);text-shadow:0 0 12px rgba(255,43,214,.7)}
  .lead{color:var(--sub);margin:0 0 14px;font-size:15px}
  .notice{display:flex;gap:8px;background:rgba(19,34,77,.7);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--sub);margin-bottom:14px}
  .notice b{color:var(--ink)}
  .mapbox{background:linear-gradient(160deg,var(--navy2),var(--navy));border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  svg{display:block;width:100%;height:auto;touch-action:manipulation;cursor:crosshair;border-radius:12px;background:#070d22}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin:9px 3px 2px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
  .dot.me{background:#b6ff3b;box-shadow:0 0 8px #b6ff3b}
  .dot.t{background:var(--pink)}
  .dot.r{border:1.5px dashed var(--cyan);background:transparent}
  .summary{margin:18px 2px 10px;font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
  .summary b{color:var(--pink);text-shadow:0 0 10px rgba(255,43,214,.6)}
  .item{display:flex;gap:12px;align-items:center;background:var(--navy2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:9px;cursor:pointer;transition:transform .08s}
  .item:active{transform:scale(.985)}
  .item.first{border:2px solid var(--cyan);box-shadow:0 0 18px rgba(59,232,255,.25)}
  .item.sel{border:2px solid var(--lime);box-shadow:0 0 16px rgba(182,255,59,.3)}
  .item.closed{opacity:.6}
  .num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 0 12px rgba(255,43,214,.6)}
  .info{flex:1;min-width:0}
  .name{font-weight:700;font-size:16px}
  .meta{font-size:13px;color:var(--sub);margin-top:2px}
  .tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:rgba(59,232,255,.15);color:var(--cyan);font-size:12px;font-weight:700}
  .tag.open{background:rgba(182,255,59,.16);color:var(--lime)}
  .tag.shut{background:rgba(255,107,107,.18);color:var(--red)}
  .dist{flex:none;text-align:right}
  .dist .m{font-size:21px;font-weight:800;color:var(--ink)}
  .dist .t{font-size:12px;color:var(--sub)}
  .empty{background:var(--navy2);border:1px dashed var(--line);border-radius:14px;padding:14px;font-size:14px;color:var(--sub);margin-bottom:9px}
  @keyframes pulse{0%{r:9;opacity:.9}100%{r:26;opacity:0}}
  .pulse{animation:pulse 1.6s ease-out infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.1}}
  .blink,.siren{animation:blink .8s steps(1) infinite}
  .siren{flex:none;font-size:22px;margin-left:-4px}
  .route{margin-top:12px;background:linear-gradient(160deg,var(--navy2),var(--navy));border:1.5px solid var(--lime);border-radius:16px;padding:12px 14px;box-shadow:0 0 18px rgba(182,255,59,.18)}
  .rtop{display:flex;gap:14px;align-items:center}
  .arrow{flex:none;width:52px;height:52px;border-radius:50%;background:rgba(182,255,59,.12);border:1.5px solid var(--lime);display:grid;place-items:center;overflow:hidden}
  .arrow i{font-style:normal;font-size:26px;line-height:1;color:var(--lime);text-shadow:0 0 10px var(--lime);display:block;transition:transform .25s}
  .rt{font-size:18px;font-weight:800}
  .rt b{color:var(--lime);text-shadow:0 0 8px rgba(182,255,59,.6)}
  .rs{font-size:13px;color:var(--sub);margin-top:2px}
  .addr{font-size:13px;color:var(--ink);margin-top:10px}
  .go{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .go a{flex:1 1 30%;text-align:center;text-decoration:none;font-size:14px;font-weight:800;padding:11px 8px;border-radius:12px;border:1.5px solid var(--lime);color:var(--lime);background:rgba(182,255,59,.08)}
  .go a.main{background:var(--lime);color:#071300}
  .rn{font-size:11.5px;color:var(--sub);opacity:.85;margin-top:9px}
  @keyframes flow{to{stroke-dashoffset:-26}}
  .flow{animation:flow .9s linear infinite}
  .reset{margin-top:12px;width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--pink);background:transparent;color:var(--pink);font-size:15px;font-weight:700;cursor:pointer;text-shadow:0 0 8px rgba(255,43,214,.5)}
  .reset:active{background:rgba(255,43,214,.12)}
  #kmap{display:none;width:100%;height:360px;border-radius:12px;overflow:hidden;touch-action:manipulation}
  .kn{position:relative;width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;border:2px solid #fff;box-shadow:0 0 12px rgba(255,43,214,.9);cursor:pointer}
  .kn.shut{background:#6b4a78;box-shadow:none}
  .kn.tgt{outline:3px solid var(--lime);outline-offset:2px}
  .kn .ks{position:absolute;left:30px;top:-8px;font-size:18px;animation:blink .8s steps(1) infinite}
  .kme{position:relative;width:28px;height:28px;pointer-events:none}
  .kme .ring{position:absolute;inset:-6px;border:2.5px solid var(--lime);border-radius:50%;animation:kpulse 1.6s ease-out infinite}
  .kme .lab{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-weight:800;font-size:13px;color:var(--lime);text-shadow:0 0 3px #000,0 0 3px #000,0 0 3px #000;white-space:nowrap}
  @keyframes kpulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2);opacity:0}}
  .locbtn{margin-top:12px;width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--lime);background:rgba(182,255,59,.08);color:var(--lime);font-size:15px;font-weight:800;cursor:pointer}
  .locbtn.on{background:var(--lime);color:#071300}
  .locmsg{font-size:12.5px;color:var(--sub);margin-top:8px;text-align:center;min-height:1.2em}

  .bar{display:flex;gap:8px;margin:0 0 6px}
  .bar button{flex:1;margin:0;padding:12px 8px;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer}
  .bar .gps{border:1.5px solid var(--lime);background:rgba(182,255,59,.08);color:var(--lime)}
  .pop{position:relative;min-width:200px;max-width:250px;background:var(--navy2);color:var(--ink);border:1.5px solid var(--lime);border-radius:14px;padding:10px 12px;box-shadow:0 6px 22px rgba(0,0,0,.55);font-size:13px;line-height:1.4;transform:translateY(-44px)}
  .pop b{display:block;font-size:15px;margin-bottom:2px;padding-right:18px}
  .pop .px{position:absolute;right:8px;top:6px;cursor:pointer;color:var(--sub);font-size:16px}
  .pop .pm{color:var(--sub)}
  .pop a{display:block;margin-top:8px;text-align:center;text-decoration:none;font-weight:800;padding:8px;border-radius:10px;background:var(--lime);color:#071300}
  .item .go{margin-top:8px}
  .item .go a{flex:none;padding:7px 14px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="badge">💩</span><span>500m <em>화장실</em> 찾기</span></h1>
  <p class="lead">🗺️ <b>카카오맵 실시간 검색</b> 기준이에요. 지도를 누르거나 GPS 버튼으로 위치를 정하면, 반경 500m 안 <b>공중화장실</b>이 가까운 순서로 나와요.</p>
  <div class="notice"><span>⚠️</span><span>처음 위치는 <b>연산역</b>이에요. 화장실 정보는 카카오맵에 등록된 장소라 <b>개방시간·상태는 방문 전에 확인</b>하세요. 위 지도의 위치는 내 폰의 GPS가 아니라 <b>내가 정한 위치</b>예요.</span></div>

  <div class="bar">
    <button class="gps" id="gps">📍 현재 내 GPS 위치로 찾기</button>
  </div>
  <div class="locmsg" id="locmsg"></div>

  <div class="mapbox">
    <div id="kmap"></div>
    <div class="legend">
      <span><i class="dot me"></i>내 위치</span>
      <span><i class="dot t"></i>화장실</span>
      <span><i class="dot r"></i>반경 500m</span>
    </div>
  </div>

  <div class="summary" id="summary"></div>
  <div id="list"></div>
  <p class="rn" id="credit">지도·장소 검색 © Kakao</p>
</div>

<script>
(function(){
  // ▼▼ 카카오 디벨로퍼스의 "JavaScript 키"만 여기에서 바꾸면 돼요 ▼▼
  var KAKAO_JS_KEY='f96484de4395f7f0a157e40018af3072';
  // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

  var START={lat:35.1862,lon:129.0815}, LEVEL=4, R=500, WALK=70;
  var KEYWORDS=['공중화장실','화장실'];
  var me={lat:START.lat,lon:START.lon};
  var map=null, ps=null, circle=null, meOv=null, markerOvs=[], popOv=null;
  var results=[], selIdx=-1, token=0;
  var kmapEl=document.getElementById('kmap'), listEl=document.getElementById('list'), sumEl=document.getElementById('summary'), msgEl=document.getElementById('locmsg');

  function setMsg(t){msgEl.textContent=t||'';}
  function walkMin(m){return Math.max(1,Math.round(m/WALK));}
  function routeUrl(p){return 'https://map.kakao.com/link/to/'+encodeURIComponent(p.place_name)+','+p.y+','+p.x;}
  function showStatus(summary,detail){
    sumEl.innerHTML='';sumEl.textContent=summary;listEl.innerHTML='';
    if(detail){var e=document.createElement('div');e.className='empty';e.textContent=detail;listEl.appendChild(e);}
  }
  function clearMarkers(){markerOvs.forEach(function(o){o.setMap(null);});markerOvs=[];closePop();}
  function closePop(){if(popOv){popOv.setMap(null);popOv=null;}}

  /* ---------- 지도 준비 ---------- */
  function startMap(){
    var c=new kakao.maps.LatLng(me.lat,me.lon);
    map=new kakao.maps.Map(kmapEl,{center:c,level:LEVEL});
    ps=new kakao.maps.services.Places();
    circle=new kakao.maps.Circle({center:c,radius:R,strokeWeight:2,strokeColor:'#0aa8c4',strokeOpacity:.9,strokeStyle:'dashed',fillColor:'#3be8ff',fillOpacity:.12});
    circle.setMap(map);
    var m=document.createElement('div');m.className='kme';
    m.innerHTML='<div class="ring"></div><svg viewBox="0 0 28 28" width="28" height="28" fill="#b6ff3b" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><circle cx="14" cy="8" r="5.5"/><path d="M5.5 25 Q5.5 13 14 13 Q22.5 13 22.5 25 Z"/></svg><div class="lab">나</div>';
    meOv=new kakao.maps.CustomOverlay({position:c,content:m,xAnchor:.5,yAnchor:.5,zIndex:5});
    meOv.setMap(map);
    kakao.maps.event.addListener(map,'click',function(e){
      var ll=e.latLng; moveMe(ll.getLat(),ll.getLng(),false); setMsg('지도에서 고른 위치예요.');
    });
    kmapEl.style.display='block';
    map.setBounds(circle.getBounds());
    search();
  }
  function moveMe(lat,lon,recenter){
    me={lat:lat,lon:lon};
    var c=new kakao.maps.LatLng(lat,lon);
    meOv.setPosition(c);circle.setPosition(c);
    if(recenter){map.setCenter(c);map.setBounds(circle.getBounds());}
    search();
  }

  /* ---------- 카카오 장소 검색 ---------- */
  function search(){
    var my=++token;
    showStatus('⏳ 주변 화장실 찾는 중…');
    clearMarkers();results=[];selIdx=-1;
    var opts={location:new kakao.maps.LatLng(me.lat,me.lon),radius:R,sort:kakao.maps.services.SortBy.DISTANCE,size:15};
    var pending=KEYWORDS.length, found={}, st=[];
    KEYWORDS.forEach(function(q){
      ps.keywordSearch(q,function(data,status){
        if(my!==token)return;
        st.push(status);
        if(status===kakao.maps.services.Status.OK){
          data.forEach(function(d){if(!found[d.id])found[d.id]=d;});
        }
        if(--pending===0)finish(found,st);
      },opts);
    });
  }
  function finish(found,st){
    var S=kakao.maps.services.Status;
    var arr=Object.keys(found).map(function(k){return found[k];})
      .filter(function(p){return /화장실/.test((p.place_name||'')+' '+(p.category_name||''));})
      .filter(function(p){return !(+p.distance>R);})
      .sort(function(a,b){return (+a.distance)-(+b.distance);});
    if(!arr.length){
      var anyOk=st.indexOf(S.OK)>=0, allErr=st.length&&st.every(function(x){return x===S.ERROR;});
      if(allErr&&!anyOk){showStatus('😥 검색 중 오류가 났어요','카카오맵 검색에 실패했어요. 인터넷 연결과, 카카오 디벨로퍼스의 도메인 등록·카카오맵 사용 설정을 확인해 주세요.');}
      else{showStatus('😥 500m 안엔 없어요','반경 500m 이내에 등록된 화장실이 없습니다. 지도를 클릭해 다른 위치를 선택해 보세요.');}
      return;
    }
    results=arr;render();
  }

  /* ---------- 화면 그리기 ---------- */
  function render(){
    sumEl.innerHTML='💩 500m 안에 <b>'+results.length+'곳</b>';
    listEl.innerHTML='';
    results.forEach(function(p,i){
      var d=+p.distance||0;
      // 지도 마커
      var n=document.createElement('div');n.className='kn';n.textContent=String(i+1);
      if(i===0){var sr=document.createElement('span');sr.className='ks';sr.textContent='🚨';n.appendChild(sr);}
      n.addEventListener('click',function(ev){ev.stopPropagation();select(i,true);});
      var ov=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(+p.y,+p.x),content:n,xAnchor:.5,yAnchor:.5,zIndex:3,clickable:true});
      ov.setMap(map);markerOvs.push(ov);
      // 카드
      var it=document.createElement('div');it.className='item'+(i===0?' first':'');it.setAttribute('data-i',i);
      it.innerHTML='<div class="num"></div>'+(i===0?'<span class="siren">🚨</span>':'')+'<div class="info"><div class="name"></div><div class="meta ad"></div><div class="meta cat"></div><div class="go"><a target="_blank" rel="noopener">🚶 길찾기</a></div></div><div class="dist"><div class="m"></div><div class="t"></div></div>';
      it.querySelector('.num').textContent=String(i+1);
      it.querySelector('.name').textContent=p.place_name;
      it.querySelector('.ad').textContent='📍 '+(p.road_address_name||p.address_name||'주소 정보 없음');
      it.querySelector('.cat').textContent=p.category_name?('🏷️ '+p.category_name.split(' > ').slice(-2).join(' > ')):'';
      it.querySelector('.m').textContent=d+'m';
      it.querySelector('.t').textContent='🚶 약 '+walkMin(d)+'분';
      var a=it.querySelector('.go a');a.href=routeUrl(p);a.addEventListener('click',function(ev){ev.stopPropagation();});
      it.addEventListener('click',function(){select(i,false);});
      listEl.appendChild(it);
    });
  }
  function select(i,scrollList){
    selIdx=i;var p=results[i];
    [].forEach.call(listEl.querySelectorAll('.item'),function(el){el.classList.toggle('sel',+el.getAttribute('data-i')===i);});
    [].forEach.call(markerOvs,function(o,k){o.getContent().classList.toggle('tgt',k===i);});
    var pos=new kakao.maps.LatLng(+p.y,+p.x);
    map.panTo(pos);
    openPop(p,pos);
    if(scrollList){var el=listEl.querySelector('.item[data-i="'+i+'"]');if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'nearest'});}
    else if(kmapEl.scrollIntoView){kmapEl.scrollIntoView({behavior:'smooth',block:'center'});}
  }
  function openPop(p,pos){
    closePop();
    var box=document.createElement('div');box.className='pop';
    var x=document.createElement('span');x.className='px';x.textContent='✕';x.addEventListener('click',function(ev){ev.stopPropagation();closePop();});
    var b=document.createElement('b');b.textContent=p.place_name;
    var l1=document.createElement('div');l1.className='pm';l1.textContent=p.road_address_name||p.address_name||'주소 정보 없음';
    var l2=document.createElement('div');l2.textContent='내 위치에서 '+(+p.distance||0)+'m · 🚶 약 '+walkMin(+p.distance||0)+'분';
    var a=document.createElement('a');a.target='_blank';a.rel='noopener';a.href=routeUrl(p);a.textContent='🚶 길찾기';
    box.appendChild(x);box.appendChild(b);box.appendChild(l1);box.appendChild(l2);box.appendChild(a);
    ['click','mousedown','touchstart'].forEach(function(t){box.addEventListener(t,function(ev){ev.stopPropagation();});});
    popOv=new kakao.maps.CustomOverlay({position:pos,content:box,xAnchor:.5,yAnchor:1,zIndex:9,clickable:true});
    popOv.setMap(map);
  }

  /* ---------- 버튼 ---------- */
  document.getElementById('gps').addEventListener('click',function(){
    if(!map)return;
    if(!navigator.geolocation){setMsg('이 브라우저는 위치 기능을 지원하지 않아요.');return;}
    setMsg('📡 내 GPS 위치 찾는 중… (권한 허용 창이 뜨면 "허용"을 눌러 주세요)');
    navigator.geolocation.getCurrentPosition(function(p){
      moveMe(p.coords.latitude,p.coords.longitude,true);
      setMsg('📡 현재 내 GPS 위치 · 정확도 약 '+Math.round(p.coords.accuracy)+'m');
    },function(err){
      setMsg(err&&err.code===1?'위치 권한이 꺼져 있어요. 주소창의 위치 설정에서 허용해 주세요. (https 주소에서만 동작해요)':'GPS 위치를 가져오지 못했어요. 잠시 뒤 다시 눌러 주세요.');
    },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  });
  /* ---------- 카카오맵 SDK 불러오기 (services 라이브러리 포함) ---------- */
  showStatus('⏳ 지도를 불러오는 중…');
  var sc=document.createElement('script');
  sc.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+encodeURIComponent(KAKAO_JS_KEY)+'&libraries=services&autoload=false';
  sc.onload=function(){
    try{kakao.maps.load(startMap);}
    catch(e){showStatus('😥 지도를 시작하지 못했어요','카카오 JavaScript 키와 도메인 등록을 확인해 주세요.');}
  };
  sc.onerror=function(){
    var o=location.origin&&location.origin!=='null'?location.origin:'(이 페이지의 주소)';
    showStatus('😥 카카오맵을 불러오지 못했어요','카카오가 이 주소를 허용하지 않았을 가능성이 가장 커요. 카카오 디벨로퍼스 [앱] > [플랫폼 키] > [JavaScript 키] > [JavaScript SDK 도메인]에 이 주소를 그대로 등록해 주세요: '+o+'  (그리고 [카카오맵] 사용 설정이 ON인지, 입력한 키가 JavaScript 키인지 확인해 주세요.)');
  };
  document.head.appendChild(sc);
})();
</script>
</body>
</html>
